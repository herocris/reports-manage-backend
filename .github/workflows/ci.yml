name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_PORT: 8081
      FORWARD_DB_PORT: 3307
      SAIL_SKIP_TTY: 1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Sail environment
        run: |
          cp .env.example .env
          echo "WWWUSER=$(id -u)" >> .env
          echo "WWWGROUP=$(id -g)" >> .env
          echo "TELESCOPE_ENABLED=false" >> .env

      - name: Bootstrap Composer dependencies for Sail
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/var/www/html" \
            -w /var/www/html \
            laravelsail/php85-composer:latest \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Start Sail and MySQL
        run: vendor/bin/sail up -d --wait laravel.test mysql

      - name: Prepare application
        run: vendor/bin/sail artisan key:generate --no-interaction

      - name: Validate dependencies
        run: |
          vendor/bin/sail composer validate --strict --no-interaction
          vendor/bin/sail composer audit --no-interaction

      - name: Run tests
        run: vendor/bin/sail artisan test --compact

      - name: Check PHP formatting
        run: |
          vendor/bin/sail bin pint --format agent
          git diff --exit-code -- '*.php'

      - name: Check production bootstrap without development packages
        run: |
          vendor/bin/sail exec -T --user sail laravel.test sh -c '
            set -eu
            production_path=$(mktemp -d /tmp/reports-production.XXXXXX)
            tar --exclude=bootstrap/cache -cf - app artisan bootstrap config routes resources database composer.json composer.lock | tar -xf - -C "$production_path"
            mkdir -p "$production_path/storage/framework/cache" "$production_path/storage/framework/sessions" "$production_path/storage/framework/views" "$production_path/storage/logs" "$production_path/bootstrap/cache"
            cp .env.example "$production_path/.env"
            cd "$production_path"
            composer install --no-dev --no-interaction --prefer-dist --no-progress
            APP_DEBUG=false php artisan about --no-interaction --env=production
          '

      - name: Stop Sail
        if: always()
        run: vendor/bin/sail down
